[package]
name = "qcore"
version = "0.10.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova post quantum client core in Rust. One implementation of key derivation, transaction building, quantum safe signing with the ML-DSA-65 module lattice scheme, and the Quantova gateway wire, that the JavaScript and Python bindings are generated over so no client ever hand rolls a signature or the wire."
repository = "https://github.com/Quantova/QCore.rs"
keywords = ["post-quantum", "blockchain", "cryptography", "wallet", "quantova"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

[features]
default = ["client"]
client = []

[[bin]]
name = "qcore"
path = "src/bin/qcore.rs"
required-features = ["client"]

[dependencies]
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "9cabd50a4f88d0ce47a0f54517ace18e6975c879" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "9cabd50a4f88d0ce47a0f54517ace18e6975c879" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "9cabd50a4f88d0ce47a0f54517ace18e6975c879" }
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "9cabd50a4f88d0ce47a0f54517ace18e6975c879" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "4e37c52984740f345f96e2c8536803bce5f3b805" }
qtv-wipe = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "9cabd50a4f88d0ce47a0f54517ace18e6975c879" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "25d218719a289f943f8681e682da13a668c72290" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "9cabd50a4f88d0ce47a0f54517ace18e6975c879" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "9cabd50a4f88d0ce47a0f54517ace18e6975c879" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "394669e469a36867fb4f8ae3a58350163abf72e8" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "394669e469a36867fb4f8ae3a58350163abf72e8" }

[profile.release]
overflow-checks = true

[lints.clippy]
too_many_arguments = "allow"
manual_is_multiple_of = "allow"
