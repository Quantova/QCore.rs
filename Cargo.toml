[package]
name = "qcore"
version = "0.11.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova post quantum client core in Rust. One implementation of key derivation, transaction building, quantum safe signing with the ML-DSA-65 module lattice scheme, and the Quantova gateway wire, that the JavaScript and Python bindings are generated over so no client ever hand rolls a signature or the wire."
repository = "https://github.com/Quantova/QCore.rs"
keywords = ["post-quantum", "blockchain", "cryptography", "wallet", "quantova"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

[features]
default = ["client"]
client = []

[[bin]]
name = "qcore"
path = "src/bin/qcore.rs"
required-features = ["client"]

[dependencies]
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "806cdd956e277cfed818ef30311ecec0b84b003c" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "806cdd956e277cfed818ef30311ecec0b84b003c" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "806cdd956e277cfed818ef30311ecec0b84b003c" }
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "806cdd956e277cfed818ef30311ecec0b84b003c" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "04e5ae26a089df4e4cc8f20f3973b7cbbee594e3" }
qtv-wipe = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "806cdd956e277cfed818ef30311ecec0b84b003c" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "32825549c2e4fb2238470a04664cfa0d9cbafc2b" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "806cdd956e277cfed818ef30311ecec0b84b003c" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "806cdd956e277cfed818ef30311ecec0b84b003c" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "223e012417d804d2e953445c38c2b87d0bff6b34" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "223e012417d804d2e953445c38c2b87d0bff6b34" }

[profile.release]
overflow-checks = true

[lints.clippy]
too_many_arguments = "allow"
manual_is_multiple_of = "allow"
