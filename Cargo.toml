[package]
name = "qcore"
version = "0.8.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova post quantum client core in Rust. One implementation of key derivation, transaction building, quantum safe signing with the ML-DSA-65 module lattice scheme, and the Quantova gateway wire, that the JavaScript and Python bindings are generated over so no client ever hand rolls a signature or the wire."
repository = "https://github.com/Quantova/QCore.rs"
keywords = ["post-quantum", "blockchain", "cryptography", "wallet", "quantova"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

[features]
default = ["client"]
client = []

[[bin]]
name = "qcore"
path = "src/bin/qcore.rs"
required-features = ["client"]

[dependencies]
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "2bc396ad5dd0bc9f57670b0c8f4b5786c9824325" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "2bc396ad5dd0bc9f57670b0c8f4b5786c9824325" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "2bc396ad5dd0bc9f57670b0c8f4b5786c9824325" }
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "2bc396ad5dd0bc9f57670b0c8f4b5786c9824325" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "e47d6cd94e71c13b22e2990f8c2b0a2e3a2204d0" }
qtv-wipe = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "2bc396ad5dd0bc9f57670b0c8f4b5786c9824325" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "8c6eb5c003f1753bc23129ca02bb3610faf1cc9f" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "2bc396ad5dd0bc9f57670b0c8f4b5786c9824325" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "9a4337fe0945609d21c0b8b12b1c41816cfc57ae" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "9a4337fe0945609d21c0b8b12b1c41816cfc57ae" }

[profile.release]
overflow-checks = true

[lints.clippy]
too_many_arguments = "allow"
manual_is_multiple_of = "allow"
