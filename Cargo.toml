[package]
name = "qcore"
version = "0.11.5"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova post quantum client core in Rust. One implementation of key derivation, transaction building, quantum safe signing with the ML-DSA-65 module lattice scheme, and the Quantova gateway wire, that the JavaScript and Python bindings are generated over so no client ever hand rolls a signature or the wire."
repository = "https://github.com/Quantova/QCore.rs"
keywords = ["post-quantum", "blockchain", "cryptography", "wallet", "quantova"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

[features]
default = ["client"]
client = []

[[bin]]
name = "qcore"
path = "src/bin/qcore.rs"
required-features = ["client"]

[dependencies]
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "04c051d01c6e54395c6cbd0f74b00e425653fcbc" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "04c051d01c6e54395c6cbd0f74b00e425653fcbc" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "04c051d01c6e54395c6cbd0f74b00e425653fcbc" }
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "04c051d01c6e54395c6cbd0f74b00e425653fcbc" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "8dc50cf6eaa8bd521c0d203df5cb7fbf5b51e905" }
qtv-wipe = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "04c051d01c6e54395c6cbd0f74b00e425653fcbc" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "7137396ef4c6367d7df8872bb482738a5203fb57" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "04c051d01c6e54395c6cbd0f74b00e425653fcbc" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "04c051d01c6e54395c6cbd0f74b00e425653fcbc" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "f00f4cf53e38a1c818dcf716d92897eebb3b31c2" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "f00f4cf53e38a1c818dcf716d92897eebb3b31c2" }

[profile.release]
overflow-checks = true

[lints.clippy]
too_many_arguments = "allow"
manual_is_multiple_of = "allow"
