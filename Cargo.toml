[package]
name = "qcore"
version = "0.11.5"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova post quantum client core in Rust. One implementation of key derivation, transaction building, quantum safe signing with the ML-DSA-65 module lattice scheme, and the Quantova gateway wire, that the JavaScript and Python bindings are generated over so no client ever hand rolls a signature or the wire."
repository = "https://github.com/Quantova/QCore.rs"
keywords = ["post-quantum", "blockchain", "cryptography", "wallet", "quantova"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

[features]
default = ["client"]
client = []

[[bin]]
name = "qcore"
path = "src/bin/qcore.rs"
required-features = ["client"]

[dependencies]
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "19f2e8d5cde914ef618c5ddb564dc7dae79473ea" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "19f2e8d5cde914ef618c5ddb564dc7dae79473ea" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "19f2e8d5cde914ef618c5ddb564dc7dae79473ea" }
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "19f2e8d5cde914ef618c5ddb564dc7dae79473ea" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "38f41dede65ed1918e89402c61b711defe16ae26" }
qtv-wipe = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "19f2e8d5cde914ef618c5ddb564dc7dae79473ea" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "4a7854f25ea56d6df69addc314675c9e75f3b3bc" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "19f2e8d5cde914ef618c5ddb564dc7dae79473ea" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "19f2e8d5cde914ef618c5ddb564dc7dae79473ea" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "fb9297cde5e447226bc590af47eeb9340d554ca1" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "fb9297cde5e447226bc590af47eeb9340d554ca1" }

[profile.release]
overflow-checks = true

[lints.clippy]
too_many_arguments = "allow"
manual_is_multiple_of = "allow"
