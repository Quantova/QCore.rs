[package]
name = "qcore"
version = "0.11.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova post quantum client core in Rust. One implementation of key derivation, transaction building, quantum safe signing with the ML-DSA-65 module lattice scheme, and the Quantova gateway wire, that the JavaScript and Python bindings are generated over so no client ever hand rolls a signature or the wire."
repository = "https://github.com/Quantova/QCore.rs"
keywords = ["post-quantum", "blockchain", "cryptography", "wallet", "quantova"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

[features]
default = ["client"]
client = []

[[bin]]
name = "qcore"
path = "src/bin/qcore.rs"
required-features = ["client"]

[dependencies]
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "28d1bdf65ce596af66c8ec2a8c9dc3a58eb12a51" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "28d1bdf65ce596af66c8ec2a8c9dc3a58eb12a51" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "28d1bdf65ce596af66c8ec2a8c9dc3a58eb12a51" }
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "28d1bdf65ce596af66c8ec2a8c9dc3a58eb12a51" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "28c0fff8f620c1663663f4bd271b7bae3dbddc80" }
qtv-wipe = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "28d1bdf65ce596af66c8ec2a8c9dc3a58eb12a51" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "5634db731274589aec34601e53a5ea05fc252c4d" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "28d1bdf65ce596af66c8ec2a8c9dc3a58eb12a51" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "28d1bdf65ce596af66c8ec2a8c9dc3a58eb12a51" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "1c0ae3504f9ba07e69d39e8df5fcbccf65248b12" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "1c0ae3504f9ba07e69d39e8df5fcbccf65248b12" }

[profile.release]
overflow-checks = true

[lints.clippy]
too_many_arguments = "allow"
manual_is_multiple_of = "allow"
