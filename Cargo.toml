[package]
name = "qcore"
version = "0.11.5"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova post quantum client core in Rust. One implementation of key derivation, transaction building, quantum safe signing with the ML-DSA-65 module lattice scheme, and the Quantova gateway wire, that the JavaScript and Python bindings are generated over so no client ever hand rolls a signature or the wire."
repository = "https://github.com/Quantova/QCore.rs"
keywords = ["post-quantum", "blockchain", "cryptography", "wallet", "quantova"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

[features]
default = ["client"]
client = []

[[bin]]
name = "qcore"
path = "src/bin/qcore.rs"
required-features = ["client"]

[dependencies]
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "6d3c14b7d7f97e01a2997ddc14ea727022ecc4b6" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "6d3c14b7d7f97e01a2997ddc14ea727022ecc4b6" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "6d3c14b7d7f97e01a2997ddc14ea727022ecc4b6" }
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "6d3c14b7d7f97e01a2997ddc14ea727022ecc4b6" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "8dc50cf6eaa8bd521c0d203df5cb7fbf5b51e905" }
qtv-wipe = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "6d3c14b7d7f97e01a2997ddc14ea727022ecc4b6" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "9fe68bf56ff48ff2fa84351b24097c751e5d27e3" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "6d3c14b7d7f97e01a2997ddc14ea727022ecc4b6" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "6d3c14b7d7f97e01a2997ddc14ea727022ecc4b6" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "26cf4bf0dceee67cb2868b3f2afe1089ac69bc57" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "26cf4bf0dceee67cb2868b3f2afe1089ac69bc57" }

[profile.release]
overflow-checks = true

[lints.clippy]
too_many_arguments = "allow"
manual_is_multiple_of = "allow"
