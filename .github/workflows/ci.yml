name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: QCore.rs
          persist-credentials: false
      - name: resolve cross repo pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          pin() { awk -v k="$1" '$1==k{print $2}' QCore.rs/cross-repo-pins; }
          for k in Q-Crypto Quantova-Chain QVM; do
            v=$(pin "$k")
            case "$v" in
              *[!0-9a-f]* | "") echo "cross-repo-pins $k is not a commit: '$v'" >&2; exit 1 ;;
            esac
            if [ "${#v}" -ne 40 ]; then
              echo "cross-repo-pins $k must name a full commit, not '$v'" >&2; exit 1
            fi
          done
          for k in Q-Crypto Quantova-Chain QVM; do
            locked=$(grep -oE "$k\\.git\\?rev=[0-9a-f]{40}" QCore.rs/Cargo.lock | sed "s/.*rev=//" | sort -u)
            if [ "$locked" != "$(pin "$k")" ]; then
              echo "Cargo.lock $k does not match the pinned $(pin "$k")" >&2
              echo "$locked" >&2
              exit 1
            fi
          done
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: fmt
        working-directory: QCore.rs
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: QCore.rs
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        working-directory: QCore.rs
        run: cargo test --all-features --locked
      - name: deny
        working-directory: QCore.rs
        run: |
          cargo install --locked cargo-deny --version 0.19.9
          cargo deny check bans licenses sources advisories
