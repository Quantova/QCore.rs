name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/Quantova-Chain
          ref: d7ff0a9f9a8b2bac24cf2ae24b0b876b42ec9559
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/QVM
          ref: 4641cf57c40278aa1123825488760008e6550530
          path: QVM
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: fmt
        working-directory: QCore.rs
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: QCore.rs
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        working-directory: QCore.rs
        run: cargo test --all-features --locked
